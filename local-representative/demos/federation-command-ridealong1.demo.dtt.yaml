# Demo -- FC Ridealongs 101: federation-command comes up and rides along through a ridealong.
#
# A general lead-in, the ridealong and a general tear-down. It is a DTT
# composition, shaped like the built-in robot-cool demo, and each phase
# calls one of dtt's examples (found among dtt's own examples/):
#
#   lead-in    localrep-demo-prepare: wake the node, put the demo page on
#              its desktop and switch to an empty workspace.
#   ridealong  localrep-demo-fc-ridealong: bring up a new federation-command
#              terminal, maximized; write a three-step ridealong through it
#              and show it; start it (ridealong <file>) and step through
#              every step as the ridealong panel's "execute command" does;
#              then close the terminal.
#   tear-down  localrep-demo-shutdown: delete the page and switch back to
#              the first workspace.
#   compose    composer puts the three renders together, with a title card,
#              a chapter card before each part and a closing card, into
#              demo-federation-command-ridealong1-<time>, a WebM in the
#              files tab.
#
# Every call is given this document's time (at), so they share the demo
# page and the names of their runs and compositions. A phase that fails
# stops the ones after it -- a failed ridealong may leave its terminal open,
# to close by hand before localrep-demo-shutdown with the same at.
#
# It needs local-representative connected to agent-coordinator on the node,
# with ianar and federation-command built beside it; GNOME with dynamic
# workspaces and its default keys; a terminal for federation-command to
# open in; google-chrome; and, on the node running the demo, compose
# launched and connected (or ffmpeg, for composer to render without an open
# compose tab).
#
# On the demo tab's protosurf map, beside what its phases call, it is about
# (focal) federation-command's ridealongs, and needs on the way
# (supporting) the rest of federation-command, LR driving it and the robot:
#
#   focal: federation-command/ridealong.go federation-command/ridealong/
#   supporting: federation-command/ local-representative/controlops.go local-representative/fcinstances.go ianar/
#
#   dtt assert federation-command-ridealong1.demo.dtt.yaml --var node=<node>

variables:
  node:
    default: ""
    help: the node to give the demo on, as agent-coordinator names it; empty for this node

timestamp:
  select: now
  alias: the-time

# ---- lead-in (general) ----

dtt.calls:
  select:
    document: localrep-demo-prepare.dtt.yaml
  alias: prep
  phase: lead-in
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- subject ----

dtt.calls:
  select:
    document: localrep-demo-fc-ridealong.dtt.yaml
  alias: ridealong
  phase: ridealong
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- tear-down (general) ----

dtt.calls:
  select:
    document: localrep-demo-shutdown.dtt.yaml
  alias: shut
  phase: tear-down
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- compose ----

localrep.compositions:
  select:
    id: demo-federation-command-ridealong1-${{the-time.unix}}
  alias: demo-comp
  phase: compose
  assert:
    composition: |
      {
        "name": "FC Ridealongs 101 on ${{prep.by_alias.prep-seq.node}} -- ${{the-time.human-readable}}",
        "width": 1280,
        "height": 720,
        "video": [
          {"kind": "title", "duration": 3, "text": "FC Ridealongs 101 -- ${{prep.by_alias.prep-seq.node}}, ${{the-time.human-readable}}", "color": "#ffffff", "background": "#1a1a1a"},
          {"kind": "title", "duration": 3, "text": "Lead-in: wake the node, put the demo page on its desktop, and switch to an empty workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{prep.by_alias.prep-comp.render.file_id}}", "file_name": "${{prep.by_alias.prep-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "federation-command comes up, and we ride along through a three-step ridealong", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{ridealong.by_alias.fcride-comp.render.file_id}}", "file_name": "${{ridealong.by_alias.fcride-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "Tear-down: delete the demo page and go back to the first workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{shut.by_alias.shut-comp.render.file_id}}", "file_name": "${{shut.by_alias.shut-comp.render.name}}"},
          {"kind": "title", "duration": 2, "text": "Brought up, rode along, and torn down", "color": "#1a1a1a", "background": "#e0e0e0"}
        ],
        "audio": []
      }
    rendered: true
    renderer: auto
    wait: 600
