# Demo -- the robot on a local system under test: open, read, zoom and close a page.
#
# The shortest demo: a general lead-in, one subject and a general tear-down,
# with no subject-area lead-in or tear-down between them. It is a DTT
# composition, duplicated from dtt's localrep-demo-complete example, and
# each phase calls one of dtt's examples (found among dtt's own examples/):
#
#   lead-in    localrep-demo-prepare: wake the node, put the demo page on
#              its desktop and switch to an empty workspace.
#   robot      localrep-demo-cool: the robot opens the page, reads it back
#              off the screen, zooms it and closes it.
#   tear-down  localrep-demo-shutdown: delete the page and switch back to
#              the first workspace, so GNOME removes the demo's.
#   compose    composer puts the three renders together, with a title card,
#              a chapter card before each part and a closing card, into
#              demo-robot-cool-<time>, rendered into a WebM in the files tab.
#
# Every call is given this document's time (at), so they share the demo
# page and the names of their runs and compositions; each run gives a new
# demo. A phase that fails stops the ones after it -- a failed robot phase
# leaves the node prepared, for the tear-down on its own (localrep-demo-shutdown
# with the same at).
#
# It needs local-representative connected to agent-coordinator on the node,
# with ianar built beside it; GNOME with dynamic workspaces; google-chrome;
# and, on the node running the demo, compose launched and connected.
#
# On the demo tab's protosurf map, beside what its phases call, it is about
# (focal) the robot's sequence ops, reading the screen and its keyboard,
# and needs on the way (supporting) LR driving the robot, its captures and
# its screen recording:
#
#   focal: ianar/seqv2_ops.go ianar/vision.go ianar/keyboard.go
#   supporting: ianar/robot.go ianar/lrrun.go ianar/lrcapture.go ianar/screencast_linux.go
#
#   dtt assert robot-cool.demo.dtt.yaml --var node=<node>

variables:
  node:
    default: ""
    help: the node to give the demo on, as agent-coordinator names it; empty for this node

timestamp:
  select: now
  alias: the-time

# ---- lead-in (general) ----

dtt.calls:
  select:
    document: localrep-demo-prepare.dtt.yaml
  alias: prep
  phase: lead-in
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- subject ----

dtt.calls:
  select:
    document: localrep-demo-cool.dtt.yaml
  alias: cool
  phase: robot
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- tear-down (general) ----

dtt.calls:
  select:
    document: localrep-demo-shutdown.dtt.yaml
  alias: shut
  phase: tear-down
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- compose ----

localrep.compositions:
  select:
    id: demo-robot-cool-${{the-time.unix}}
  alias: demo-comp
  phase: compose
  assert:
    composition: |
      {
        "name": "Robot demo on ${{prep.by_alias.prep-seq.node}} -- ${{the-time.human-readable}}",
        "width": 1280,
        "height": 720,
        "video": [
          {"kind": "title", "duration": 3, "text": "The robot on ${{prep.by_alias.prep-seq.node}} -- ${{the-time.human-readable}}", "color": "#ffffff", "background": "#1a1a1a"},
          {"kind": "title", "duration": 3, "text": "Lead-in: wake the node, put the demo page on its desktop, and switch to an empty workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{prep.by_alias.prep-comp.render.file_id}}", "file_name": "${{prep.by_alias.prep-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "The robot opens the page, reads it back off the screen, zooms it and closes it", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{cool.by_alias.cool-comp.render.file_id}}", "file_name": "${{cool.by_alias.cool-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "Tear-down: delete the demo page and go back to the first workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{shut.by_alias.shut-comp.render.file_id}}", "file_name": "${{shut.by_alias.shut-comp.render.name}}"},
          {"kind": "title", "duration": 2, "text": "Led in, demonstrated and torn down", "color": "#1a1a1a", "background": "#e0e0e0"}
        ],
        "audio": []
      }
    rendered: true
    renderer: auto
    wait: 600
