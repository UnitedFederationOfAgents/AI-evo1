# Demo -- Robot hello world, read: the robot reads its demo page back off a local system under test.
#
# One of the three robot hello-world demos the robot-hello suite runs in a
# row (suites/robot-hello.suite.yaml). Each has the shortest demo shape: a
# general lead-in, one subject and a general tear-down, then compose. It is
# a DTT composition, and each phase calls one of dtt's examples (found
# among dtt's own examples/):
#
#   lead-in    localrep-demo-prepare: wake the node, put the demo page on
#              its desktop and switch to an empty workspace.
#   read       localrep-demo-robot-hello-read: the robot opens the demo
#              page, reads back off the screen when it was prepared,
#              captures the screen and closes the page.
#   tear-down  localrep-demo-shutdown: delete the page and switch back to
#              the first workspace.
#   compose    composer puts the three renders together, with a title card,
#              a chapter card before each part and a closing card, into
#              demo-robot-hello-read-<time>, a WebM in the files tab.
#
# The record's primary video is the read phase's render: the robot's part
# alone, without the lead-in and tear-down. Its screenshot is kept with the
# record, in artifacts/screenshots/.
#
# It needs local-representative connected to agent-coordinator on the node,
# with ianar built beside it; GNOME with dynamic workspaces; google-chrome;
# and, on the node running the demo, compose launched and connected.
#
# On the demo tab's protosurf map, beside what its phases call, it is about
# (focal) the robot's sequence ops and reading the screen, and needs on the
# way (supporting) LR driving the robot, its captures and its screen
# recording:
#
#   focal: ianar/seqv2_ops.go ianar/vision.go
#   supporting: ianar/robot.go ianar/lrrun.go ianar/lrcapture.go ianar/screencast_linux.go
#
#   dtt assert robot-hello-read.demo.dtt.yaml --var node=<node>

variables:
  node:
    default: ""
    help: the node to give the demo on, as agent-coordinator names it; empty for this node

timestamp:
  select: now
  alias: the-time

# ---- lead-in (general) ----

dtt.calls:
  select:
    document: localrep-demo-prepare.dtt.yaml
  alias: prep
  phase: lead-in
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- subject ----

dtt.calls:
  select:
    document: localrep-demo-robot-hello-read.dtt.yaml
  alias: rh
  phase: read
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- tear-down (general) ----

dtt.calls:
  select:
    document: localrep-demo-shutdown.dtt.yaml
  alias: shut
  phase: tear-down
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- compose ----

localrep.compositions:
  select:
    id: demo-robot-hello-read-${{the-time.unix}}
  alias: demo-comp
  phase: compose
  assert:
    composition: |
      {
        "name": "Robot hello (read) on ${{prep.by_alias.prep-seq.node}} -- ${{the-time.human-readable}}",
        "width": 1280,
        "height": 720,
        "video": [
          {"kind": "title", "duration": 3, "text": "Robot hello world (read) on ${{prep.by_alias.prep-seq.node}} -- ${{the-time.human-readable}}", "color": "#ffffff", "background": "#1a1a1a"},
          {"kind": "title", "duration": 3, "text": "Lead-in: wake the node, put the demo page on its desktop, and switch to an empty workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{prep.by_alias.prep-comp.render.file_id}}", "file_name": "${{prep.by_alias.prep-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "Robot hello: the robot opens the demo page, reads it back off the screen and captures it", "color": "#ffffff", "background": "#1e3a5f"},
          {"kind": "media", "file_id": "${{rh.by_alias.rh-read-comp.render.file_id}}", "file_name": "${{rh.by_alias.rh-read-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "Tear-down: delete the demo page and go back to the first workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{shut.by_alias.shut-comp.render.file_id}}", "file_name": "${{shut.by_alias.shut-comp.render.name}}"},
          {"kind": "title", "duration": 2, "text": "Led in, said hello world, and torn down", "color": "#1a1a1a", "background": "#e0e0e0"}
        ],
        "audio": []
      }
    rendered: true
    renderer: auto
    wait: 600
