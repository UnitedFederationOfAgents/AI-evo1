# A built-in declarative tool (see ../../README.md "Declarative tools"):
# dtt's own engine reads or asserts the document, for localrep and timestamp
# statements.
format: dtt-v1
name: localrep
description: Read or assert what local-representative and its sub-apps make -- control sequences in its library (imported from a source file) and runs of them by key, on this node or another through agent-coordinator, with their screen recordings; Polly clips from The Conversationalist; composer's compositions and their renders; files in the preferred file cache (this host's own, its files tab); the URL of the agent-coordinator this node is connected to -- from a DTT document, and return the image of what was measured. Asserting imports sequences, runs them once per key, makes clips, saves and renders compositions and uploads files, changing a field only from empty, from what from_image saw, or (force) from anything.
describe: "localrep {mode}"
inputs:
  - name: document
    type: text
    help: the DTT document (localrep.*, timestamp, delay and dtt.calls statements); or give document_file
  - name: document_file
    type: path
    help: a file holding the DTT document, relative to where dtt runs
  - name: variables
    type: text
    help: values for the document's variables, name=value on each line (or a JSON object); the rest take their defaults
  - name: mode
    choices: [read, assert, delete]
    default: read
    help: read only measures; assert also imports, runs, makes, renders and uploads; delete removes the sequences, clips, compositions and cached files an assert would make (runs are kept)
  - name: from_image
    type: text
    help: an earlier image (its JSON, or the path of its file) -- a field still as it saw it may change
  - name: force
    type: bool
    default: "false"
    help: true to change asserted fields whatever they hold (from "*")
outputs:
  values:
    - name: changed
      help: how many fields were changed
    - name: held
      help: how many asserted fields held a value they may not be changed from
    - name: unchanged
      help: how many asserted fields already held what was asserted
    - name: would_change
      help: in read mode, how many fields an assert would change
    - name: objects
      help: how many objects the image holds
    - name: image_json
      help: the image itself, as JSON -- every field of every selected object, as the run left it
  files:
    - name: image
      help: the image, as JSON
entrypoint:
  runtime: exec
  script: run.sh
  timeout: 60m
