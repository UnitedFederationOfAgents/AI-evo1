# Demo -- session-manager hello world, from a terminal to the browser and back.
#
# The full lead-in / tear-down shape: a general lead-in, then a lead-in for
# the subject area (session-manager), the subject, the area's tear-down and
# the general tear-down. It is a DTT composition, duplicated from dtt's
# localrep-demo-session-full example, and each phase calls one of dtt's
# examples (found among dtt's own examples/):
#
#   lead-in            localrep-demo-prepare: wake the node, put the demo
#                      page on its desktop and switch to an empty workspace.
#   session-lead-in    localrep-demo-session-prepare: make sure
#                      session-manager is running, and open a terminal and,
#                      beside it, a Chrome window on the node's
#                      session-manager.
#   hello              localrep-demo-session-hello: the terminal makes a
#                      session, hello-world-<time>, with a note the robot
#                      finds in session-manager; the robot adds a note the
#                      terminal finds in the session's records.
#   session-tear-down  localrep-demo-session-shutdown: close that Chrome and
#                      the terminal.
#   tear-down          localrep-demo-shutdown: delete the page and switch
#                      back to the first workspace.
#   compose            composer puts the five renders together, with a
#                      chapter card before each, into
#                      demo-session-hello-<time>, a WebM in the files tab.
#
# To repurpose it for another sub-app, duplicate it and swap the three
# session-* calls for that area's lead-in, subject and tear-down; the
# general lead-in and tear-down stay as they are. A phase that fails stops
# the ones after it -- a failed hello leaves the session windows open, for
# localrep-demo-session-shutdown on its own (given at and the session
# lead-in's fc), then localrep-demo-shutdown. The hello-world session is
# kept.
#
# It needs local-representative connected to agent-coordinator on the node,
# with ianar, session-manager, federation-command and clauditable built
# beside it; GNOME with dynamic workspaces and its default tiling keys; a
# terminal for federation-command to open in; google-chrome; and, on the
# node running the demo, compose launched and connected.
#
# On the demo tab's protosurf map, beside what its phases call, it is about
# (focal) session-manager, and needs on the way (supporting) the robot,
# federation-command's terminal and clauditable's records:
#
#   focal: session-manager/
#   supporting: ianar/ federation-command/ clauditable/
#
#   dtt assert session-hello.demo.dtt.yaml --var node=<node>

variables:
  node:
    default: ""
    help: the node to give the demo on, as agent-coordinator names it; empty for this node
  ac_url:
    default: ""
    help: agent-coordinator's URL as the node's browser reaches it (http://host:port); empty to ask this node's local-representative

timestamp:
  select: now
  alias: the-time

# ---- lead-in (general) ----

dtt.calls:
  select:
    document: localrep-demo-prepare.dtt.yaml
  alias: prep
  phase: lead-in
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- lead-in (session-manager) ----

dtt.calls:
  select:
    document: localrep-demo-session-prepare.dtt.yaml
  alias: sprep
  phase: session-lead-in
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}
      ac_url: ${{var.ac_url}}

# ---- subject ----

dtt.calls:
  select:
    document: localrep-demo-session-hello.dtt.yaml
  alias: shello
  phase: hello
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}
      fc: ${{sprep.by_alias.sprep-run.output.fc}}

# ---- tear-down (session-manager) ----

dtt.calls:
  select:
    document: localrep-demo-session-shutdown.dtt.yaml
  alias: sshut
  phase: session-tear-down
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}
      fc: ${{sprep.by_alias.sprep-run.output.fc}}

# ---- tear-down (general) ----

dtt.calls:
  select:
    document: localrep-demo-shutdown.dtt.yaml
  alias: shut
  phase: tear-down
  assert:
    variables:
      node: ${{var.node}}
      at: ${{the-time.unix}}

# ---- compose ----

localrep.compositions:
  select:
    id: demo-session-hello-${{the-time.unix}}
  alias: demo-comp
  phase: compose
  assert:
    composition: |
      {
        "name": "session-manager demo on ${{prep.by_alias.prep-seq.node}} -- ${{the-time.human-readable}}",
        "width": 1280,
        "height": 720,
        "video": [
          {"kind": "title", "duration": 4, "text": "A session-manager demo on ${{prep.by_alias.prep-seq.node}} -- ${{the-time.human-readable}}", "color": "#ffffff", "background": "#1a1a1a"},
          {"kind": "title", "duration": 3, "text": "1 of 5 -- Lead-in: wake the node, put the demo page on its desktop, and switch to an empty workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{prep.by_alias.prep-comp.render.file_id}}", "file_name": "${{prep.by_alias.prep-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "2 of 5 -- Open session-manager: a terminal on the left and session-manager through agent-coordinator on the right", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{sprep.by_alias.sprep-comp.render.file_id}}", "file_name": "${{sprep.by_alias.sprep-comp.render.name}}"},
          {"kind": "title", "duration": 4, "text": "3 of 5 -- Hello world: the terminal makes hello-world-${{the-time.unix}} and the robot finds its note; the robot answers and the terminal finds that", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{shello.by_alias.shello-comp.render.file_id}}", "file_name": "${{shello.by_alias.shello-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "4 of 5 -- Close session-manager's windows: the browser and the terminal", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{sshut.by_alias.sshut-comp.render.file_id}}", "file_name": "${{sshut.by_alias.sshut-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "5 of 5 -- Tear-down: delete the demo page and go back to the first workspace", "color": "#ffffff", "background": "#333333"},
          {"kind": "media", "file_id": "${{shut.by_alias.shut-comp.render.file_id}}", "file_name": "${{shut.by_alias.shut-comp.render.name}}"},
          {"kind": "title", "duration": 3, "text": "Led in, said hello world both ways, and torn down", "color": "#1a1a1a", "background": "#e0e0e0"}
        ],
        "audio": []
      }
    rendered: true
    renderer: auto
    wait: 600
